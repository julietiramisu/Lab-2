<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matcha Image Change</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Click the image to make latte together!</h1>
      <p>We like our coffee sweet and creamy.</p>
      <img id="matchaImage" src="images/cafe1.jpg" alt="Cafe 1" width="480" />
      <div class="button-group">
        <button id="matchaButton">Now click me!</button>
        <button id="finishButton" hidden>Click me too!</button>
      </div>
    </main>
  </body>
</html>
